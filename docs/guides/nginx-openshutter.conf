# Nginx configuration for OpenShutter (SvelteKit frontend + NestJS backend)
# Place this in /etc/nginx/sites-available/openshutter and symlink to sites-enabled
#
# Architecture:
# - Frontend: SvelteKit (adapter-node) on port 4000  <- nginx sends EVERYTHING here
# - Backend:  NestJS on port 5000                    <- reached only server-side, never by nginx
#
# ⚠️  DO NOT add a `location /api/ { proxy_pass http://localhost:5000; }` block.
#
# `/api/*` is served by SvelteKit, not by NestJS. The SvelteKit routes under
# frontend/src/routes/api/ are the production API surface: they authenticate the
# caller (see frontend/src/lib/server/admin-access.ts) and then call NestJS
# server-side via BACKEND_URL. Splitting /api/ off to port 5000 routes the public
# straight past that authentication layer.
#
# Keep port 5000 bound to localhost and closed at the firewall. NestJS is an
# internal service; it should not be reachable from the internet.

server {
    listen 80;
    server_name demo.openshutter.org;  # Update with your domain

    # Allow large file uploads: 500MB covers the video buffered-upload fallback.
    # Direct-to-storage presigned video uploads bypass nginx entirely.
    # The SvelteKit process also needs BODY_SIZE_LIMIT set to match.
    client_max_body_size 500M;

    # Increase timeouts for large file uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Everything — pages AND /api/* — goes to the SvelteKit frontend.
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # Don't buffer large uploads through nginx
        proxy_request_buffering off;
    }

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;
}

